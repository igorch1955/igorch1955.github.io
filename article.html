<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting… — Igor Shakhanov</title>
<script>
  /* Old article address (article.html?slug=...) — articles now live at
     /articles/<slug>/ as real pages. Forward old links there. */
  (function(){
    var slug = new URLSearchParams(window.location.search).get('slug');
    window.location.replace(slug ? '/articles/' + encodeURIComponent(slug) + '/' : '/');
  })();
</script>
</head>
<body>
<p>This page has moved. <a href="/">Go to the homepage</a>.</p>
</body>
</html>
