<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title id="pageTitle">Article — Igor Shakhanov</title>
<meta name="description" id="pageDescription" content="">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg: #0a0c10;
    --ink: #e9e6dd;
    --ink-dim: #9aa0a8;
    --gold: #c8a250;
    --line: #1c222b;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:var(--gold); text-decoration:none; border-bottom:1px solid transparent; transition:border-color .2s; }
  a:hover{ border-bottom-color:var(--gold); }

  .wrap{ max-width:720px; margin:0 auto; padding:64px 28px 100px; }

  .back-link{
    font-family:'JetBrains Mono', monospace;
    font-size:.78rem;
    color:var(--ink-dim);
    display:inline-block;
    margin-bottom:40px;
  }
  .back-link:hover{ color:var(--gold); }

  .kicker{
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:18px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(1.9rem, 4.4vw, 2.7rem);
    line-height:1.15;
    margin:0 0 14px 0;
  }
  .date{
    font-family:'JetBrains Mono', monospace;
    font-size:.78rem;
    color:var(--ink-dim);
    margin-bottom:48px;
  }

  #articleBody{ font-size:1.05rem; color:var(--ink); border-top:1px solid var(--line); padding-top:36px; }
  #articleBody h2{ font-family:'Fraunces', serif; font-weight:500; font-size:1.5rem; margin:2em 0 .6em; }
  #articleBody h3{ font-family:'Fraunces', serif; font-weight:500; font-size:1.2rem; margin:1.8em 0 .5em; }
  #articleBody p{ margin:0 0 1.2em 0; color:var(--ink); }
  #articleBody ul, #articleBody ol{ color:var(--ink); padding-left:1.3em; margin:0 0 1.2em 0; }
  #articleBody li{ margin-bottom:.4em; }
  #articleBody blockquote{
    margin:1.6em 0; padding:2px 0 2px 20px;
    border-left:2px solid var(--gold);
    color:var(--ink-dim);
    font-style:italic;
  }
  #articleBody code{ font-family:'JetBrains Mono', monospace; font-size:.9em; background:#141922; padding:.15em .4em; border-radius:3px; }
  #articleBody pre{ background:#0f1319; border:1px solid var(--line); border-radius:6px; padding:16px; overflow-x:auto; }
  #articleBody pre code{ background:none; padding:0; }
  #articleBody img{ max-width:100%; border-radius:4px; }
  #articleBody hr{ border:none; border-top:1px solid var(--line); margin:2.4em 0; }

  .status-msg{ color:var(--ink-dim); font-family:'JetBrains Mono', monospace; font-size:.85rem; }
</style>
</head>
<body>

<div class="wrap">
  <a class="back-link" href="/">← igorch1955.github.io</a>
  <div id="articleHead"><p class="status-msg">Loading…</p></div>
  <div id="articleBody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script>
(function(){
  function showError(msg){
    document.getElementById('articleHead').innerHTML = '<p class="status-msg">' + msg + '</p>';
  }

  var params = new URLSearchParams(window.location.search);
  var slug = params.get('slug');

  if(!slug){
    showError('No article specified.');
    return;
  }

  fetch('articles/articles.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      var article = (data.articles || []).find(function(a){ return a.slug === slug; });
      if(!article){
        showError('Article not found.');
        return;
      }

      document.title = article.title + ' — Igor Shakhanov';
      var descMeta = document.getElementById('pageDescription');
      if(descMeta && article.body_markdown){
        descMeta.setAttribute('content', article.body_markdown.replace(/[#*>`\-\n]/g,' ').slice(0,160));
      }

      var headHtml = '';
      if(article.kicker) headHtml += '<div class="kicker">' + article.kicker + '</div>';
      headHtml += '<h1>' + article.title + '</h1>';
      if(article.date) headHtml += '<div class="date">' + article.date + '</div>';
      document.getElementById('articleHead').innerHTML = headHtml;

      var bodyEl = document.getElementById('articleBody');
      if(window.marked){
        bodyEl.innerHTML = marked.parse(article.body_markdown || '');
      } else {
        // Fallback if the CDN script failed to load
        bodyEl.textContent = article.body_markdown || '';
      }
    })
    .catch(function(err){
      showError('Could not load this article.');
      console.error('article load error:', err);
    });
})();
</script>

</body>
</html>
