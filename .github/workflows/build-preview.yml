# Temporary: builds the site with the official GitHub Pages builder and
# pushes the result to the build-preview branch for inspection.
name: build-preview
on:
  push:
    branches: [jekyll]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Push built site to build-preview
        run: |
          cd _site
          sudo chown -R "$(id -u)" .
          git init -q -b build-preview
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-preview
