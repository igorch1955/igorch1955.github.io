backend:
  name: github
  repo: igorch1955/igorch1955.github.io
  branch: main
  base_url: https://peaceful-daffodil-424726.netlify.app
  auth_endpoint: /.netlify/functions/auth

media_folder: "covers"
public_folder: "covers"

collections:
  - name: "papers"
    label: "Papers"
    files:
      - file: "_data/works.json"
        label: "Publications data"
        name: "works"
        fields:
          - { label: "Papers", name: "papers", widget: "list", fields: [
              { label: "Kicker", name: "kicker", widget: "string" },
              { label: "Title", name: "title", widget: "string" },
              { label: "Description", name: "description", widget: "text" },
              { label: "Links", name: "links", widget: "list", fields: [
                  { label: "Label", name: "label", widget: "string" },
                  { label: "URL", name: "url", widget: "string" }
                ]}
            ]}
          - { label: "Books", name: "books", widget: "list", fields: [
              { label: "Kicker", name: "kicker", widget: "string" },
              { label: "Title", name: "title", widget: "string" },
              { label: "Description", name: "description", widget: "text" },
              { label: "Cover image", name: "cover", widget: "image", required: false },
              { label: "Links", name: "links", widget: "list", fields: [
                  { label: "Label", name: "label", widget: "string" },
                  { label: "URL", name: "url", widget: "string" }
                ]}
            ]}

  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    folder: "_articles"          # one Markdown file per article
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{fields.slug}}"      # file name = web address: /articles/<slug>/
    summary: "{{date}} · {{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Slug (web address: /articles/<slug>/)", name: "slug", widget: "string", pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "lowercase letters, digits and dashes only"], hint: "e.g. my-article-title. Do not change after publishing — the address would change." }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Kicker", name: "kicker", widget: "string", required: false, hint: "Small line above the title" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Description (for Google, ~160 characters)", name: "description", widget: "text", required: false, hint: "Shown in search results. If empty, the first lines of the text are used." }
      - { label: "Body", name: "body", widget: "markdown" }
