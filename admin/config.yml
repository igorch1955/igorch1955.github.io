backend:
  name: github
  repo: igorch1955/igorch1955.github.io
  branch: main
  base_url: https://peaceful-daffodil-424726.netlify.app
  auth_endpoint: /.netlify/functions/auth

media_folder: "covers"
public_folder: "covers"

collections:
  - name: "papers"
    label: "Papers"
    files:
      - file: "works.json"
        label: "Publications data"
        name: "works"
        fields:
          - { label: "Papers", name: "papers", widget: "list", fields: [
              { label: "Kicker", name: "kicker", widget: "string" },
              { label: "Title", name: "title", widget: "string" },
              { label: "Description", name: "description", widget: "text" },
              { label: "Links", name: "links", widget: "list", fields: [
                  { label: "Label", name: "label", widget: "string" },
                  { label: "URL", name: "url", widget: "string" }
                ]}
            ]}
          - { label: "Books", name: "books", widget: "list", fields: [
              { label: "Kicker", name: "kicker", widget: "string" },
              { label: "Title", name: "title", widget: "string" },
              { label: "Description", name: "description", widget: "text" },
              { label: "Cover image", name: "cover", widget: "image", required: false },
              { label: "Links", name: "links", widget: "list", fields: [
                  { label: "Label", name: "label", widget: "string" },
                  { label: "URL", name: "url", widget: "string" }
                ]}
            ]}

  - name: "articles"
    label: "Articles (full text, not listed on homepage)"
    files:
      - file: "articles/articles.json"
        label: "Articles data"
        name: "articles"
        fields:
          - { label: "Articles", name: "articles", widget: "list", fields: [
              { label: "Slug (used in the URL: article.html?slug=...)", name: "slug", widget: "string", hint: "lowercase, no spaces, e.g. my-article-title" },
              { label: "Kicker", name: "kicker", widget: "string", required: false },
              { label: "Title", name: "title", widget: "string" },
              { label: "Date", name: "date", widget: "string", required: false, hint: "e.g. 2026-09-17" },
              { label: "Body", name: "body_markdown", widget: "markdown" }
            ]}
